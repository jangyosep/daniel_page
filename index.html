<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daniel의 작은 앨범</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <nav class="topbar" aria-label="주요 메뉴">
        <a class="brand" href="#top" aria-label="첫 화면으로 이동">
          <span class="brand-mark" aria-hidden="true">♡</span>
          <span>Daniel Album</span>
        </a>
        <div class="dday-card" aria-label="Daniel D-day">
          <span>Since 2023.10.17</span>
          <strong id="dayCounter">D+0</strong>
        </div>
      </nav>

      <section class="hero-layout" id="top">
        <div class="hero-content">
          <p class="eyebrow">우리 가족의 반짝이는 순간들</p>
          <h1>Daniel의 작은 앨범</h1>
          <p class="hero-copy">
            아들의 사랑스러운 표정과 오래 간직하고 싶은 하루를 모아둔
            따뜻한 사진 공간입니다.
          </p>
          <div class="music-panel" aria-label="BGM 선택">
            <p>귀여운 BGM</p>
            <div class="music-buttons">
              <button class="music-button" type="button" data-track="0">꿈꾸는 별</button>
              <button class="music-button" type="button" data-track="1">폭신한 구름</button>
              <button class="music-button" type="button" data-track="2">작은 행진</button>
              <button class="music-button stop" id="stopMusic" type="button">정지</button>
            </div>
          </div>
        </div>

        <figure class="hero-photo">
          <img id="heroImage" src="images/daniel-01.jpg" alt="Daniel의 대표 사진" />
          <figcaption>Today’s favorite moment</figcaption>
        </figure>
      </section>
    </header>

    <main>
      <section class="section gallery-section" id="gallery">
        <div class="section-heading">
          <p class="eyebrow">Album</p>
          <h2>Daniel 앨범</h2>
        </div>
        <div class="tabs" role="tablist" aria-label="앨범 보기">
          <button class="tab-button active" type="button" role="tab" aria-selected="true" data-panel="photosPanel">
            사진
          </button>
          <button class="tab-button" id="media" type="button" role="tab" aria-selected="false" data-panel="videosPanel">
            동영상
          </button>
        </div>
        <div class="tab-panel active" id="photosPanel" role="tabpanel">
          <div class="gallery" id="galleryGrid" aria-live="polite"></div>
        </div>
        <div class="tab-panel" id="videosPanel" role="tabpanel" hidden>
          <div class="video-gallery" id="videoGrid"></div>
        </div>
      </section>
    </main>

    <dialog class="photo-dialog" id="photoDialog" aria-label="사진 크게 보기">
      <button class="close-button" type="button" id="closeDialog" aria-label="닫기">
        ×
      </button>
      <img id="dialogImage" alt="" />
      <div class="dialog-caption">
        <h2 id="dialogTitle"></h2>
      </div>
    </dialog>

    <footer class="footer">
      <p>Made with love for Daniel.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
