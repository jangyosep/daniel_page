<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daniel의 작은 앨범</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <nav class="topbar" aria-label="주요 메뉴">
        <a class="brand" href="#top" aria-label="첫 화면으로 이동">
          <span class="brand-mark" aria-hidden="true">♡</span>
          <span>Daniel Album</span>
        </a>
        <div class="nav-links">
          <a href="#gallery">사진</a>
          <a href="#gallery">추천</a>
        </div>
      </nav>

      <section class="hero-layout" id="top">
        <div class="hero-content">
          <p class="eyebrow">우리 가족의 반짝이는 순간들</p>
          <h1>Daniel의 작은 앨범</h1>
          <p class="hero-copy">
            아들의 사랑스러운 표정과 오래 간직하고 싶은 하루를 모아둔
            따뜻한 사진 공간입니다.
          </p>
          <div class="hero-actions">
            <a class="primary-button" href="#gallery">사진 보기</a>
          <a class="ghost-button" href="#gallery">추천 사진 보기</a>
          </div>
        </div>

        <figure class="hero-photo">
          <img src="images/daniel-01.jpg" alt="Daniel의 대표 사진" />
          <figcaption>Today’s favorite moment</figcaption>
        </figure>
      </section>
    </header>

    <main>
      <section class="section gallery-section" id="gallery">
        <div class="section-heading">
          <p class="eyebrow">Gallery</p>
          <h2>Daniel 사진첩</h2>
        </div>
        <div class="tabs" role="tablist" aria-label="사진 분류">
          <button class="tab-button active" type="button" role="tab" aria-selected="true" data-filter="all">
            전체 사진
          </button>
          <button class="tab-button" type="button" role="tab" aria-selected="false" data-filter="favorite">
            추천 사진
          </button>
          <button class="tab-button" type="button" role="tab" aria-selected="false" data-filter="new">
            새로 추가
          </button>
          <button class="tab-button" type="button" role="tab" aria-selected="false" data-filter="cute">
            귀여운 순간
          </button>
        </div>
        <div class="gallery" id="galleryGrid" aria-live="polite"></div>
      </section>
    </main>

    <dialog class="photo-dialog" id="photoDialog" aria-label="사진 크게 보기">
      <button class="close-button" type="button" id="closeDialog" aria-label="닫기">
        ×
      </button>
      <img id="dialogImage" alt="" />
      <div class="dialog-caption">
        <h2 id="dialogTitle"></h2>
        <p id="dialogDescription"></p>
      </div>
    </dialog>

    <footer class="footer">
      <p>Made with love for Daniel.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
